<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 大停電：生存抉擇 (Blackout 2026)</title>
    <style>
        :root {
            --bg-color: #0a0d12;
            --panel-bg: #141923;
            --border-color: #2a3447;
            --text-main: #d1d5db;
            --text-bright: #f3f4f6;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .game-container {
            width: 100%;
            max-width: 680px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Setup Screen Style */
        .setup-screen {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setup-title {
            font-size: 1.5rem;
            color: var(--text-bright);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setup-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setup-label {
            font-size: 0.95rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .setup-options {
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(140px, 1fr) );
            gap: 10px;
        }

        .opt-card {
            background: #1e2636;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .opt-card.selected {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #fff;
            font-weight: bold;
        }

        .start-btn {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .start-btn:hover { background: #059669; }

        /* HUD Header */
        .hud-header {
            background-color: #0f131c;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        @media (min-width: 480px) {
            .hud-header {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-bright);
        }

        .stat-water { color: var(--accent-blue); }
        .stat-battery { color: var(--accent-amber); }
        .stat-morale { color: var(--accent-green); }

        /* Story Area */
        .story-area {
            padding: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .time-badge {
            align-self: flex-start;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .story-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-bright);
            white-space: pre-line;
        }

        /* Random Event Box */
        .event-box {
            margin-top: 15px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-left: 4px solid var(--accent-purple);
            padding: 12px 15px;
            border-radius: 6px;
            animation: fadeIn 0.4s ease-out;
        }

        .event-title {
            color: var(--accent-purple);
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 4px;
        }

        .event-desc { font-size: 0.95rem; color: #ddd6fe; }

        /* Inventory Drawer */
        .inventory-bar {
            padding: 10px 24px;
            background: #0f131c;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
        }

        .inventory-title { color: #6b7280; font-weight: 600; white-space: nowrap; }
        .inventory-items { display: flex; gap: 8px; flex-wrap: nowrap; }
        .inv-tag { background: #1f2937; border: 1px solid #374151; padding: 2px 8px; border-radius: 4px; color: #d1d5db; white-space: nowrap; }

        /* Choices Area */
        .choices-area {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #121722;
        }

        .choice-btn {
            background: #1e2636;
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.98rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .choice-btn:hover { background: #283348; border-color: var(--accent-blue); }

        /* Ending Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center; align-items: center;
            padding: 20px; z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            max-width: 500px; width: 100%;
            padding: 24px; text-align: center;
        }

        .rank-badge { font-size: 3.5rem; font-weight: 900; margin: 10px 0; }
        .rank-s { color: var(--accent-green); }
        .rank-f { color: var(--accent-red); }

        .modal-title { font-size: 1.5rem; color: var(--text-bright); margin-bottom: 8px; }
        .modal-desc { color: #9ca3af; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }

        .restart-btn {
            background: var(--accent-blue);
            color: #fff; border: none; padding: 12px 24px;
            border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 開局設定畫面 (Setup Screen) -->
        <div id="setup-screen" class="setup-screen">
            <h2 class="setup-title">🏠 開局設定：背景設定</h2>

            <div class="setup-group">
                <span class="setup-label">1. 家人組合 (影響水糧消耗與防禦能力)</span>
                <div class="setup-options">
                    <div class="opt-card selected" onclick="selectFamily('solo', this)">👤 獨居</div>
                    <div class="opt-card" onclick="selectFamily('partner', this)">👩‍❤️‍👨 伴侶同住</div>
                    <div class="opt-card" onclick="selectFamily('parents', this)">👨‍👩‍👦 父母同住</div>
                </div>
            </div>

            <div class="setup-group">
                <span class="setup-label">2. 居住樓層 (影響體力消耗與治安風險)</span>
                <div class="setup-options">
                    <div class="opt-card selected" onclick="selectFloor('low', this)">🏢 低樓層 (2樓)</div>
                    <div class="opt-card" onclick="selectFloor('high', this)">🏙️ 高樓層 (25樓)</div>
                </div>
            </div>

            <button class="start-btn" onclick="initGame()">開始大停電生存任務</button>
        </div>

        <!-- 遊戲主介面 (Game Screen) -->
        <div id="game-screen" style="display: none;">
            <div class="hud-header">
                <div class="stat-card">
                    <span class="stat-label">飲用水</span>
                    <span id="stat-water" class="stat-value stat-water">4.0 L</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">手機電量</span>
                    <span id="stat-battery" class="stat-value stat-battery">68%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">士氣值</span>
                    <span id="stat-morale" class="stat-value stat-morale">80%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">時間線</span>
                    <span id="stat-time" class="stat-value" style="font-size: 0.95rem;">DAY 1 23:00</span>
                </div>
            </div>

            <div class="inventory-bar">
                <span class="inventory-title">背包物資:</span>
                <div id="inventory-list" class="inventory-items"></div>
            </div>

            <div class="story-area">
                <div id="time-badge" class="time-badge">DAY 1 - 23:00</div>
                <div id="story-text" class="story-text"></div>
                <div id="event-container"></div>
            </div>

            <div id="choices-container" class="choices-area"></div>
        </div>
    </div>

    <!-- 結局彈窗 -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div id="modal-rank" class="rank-badge">S</div>
            <h2 id="modal-title" class="modal-title">生存評估報告</h2>
            <p id="modal-desc" class="modal-desc"></p>
            <button class="restart-btn" onclick="resetToSetup()">重新選擇開局設定</button>
        </div>
    </div>

    <script>
        // 設定與變數
        let config = { family: 'solo', floor: 'low' };
        let state = { water: 4.0, battery: 68, morale: 80, time: "DAY 1 23:00", inventory: [], currentNode: "START" };

        function selectFamily(val, el) {
            config.family = val;
            el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectFloor(val, el) {
            config.floor = val;
            el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function initGame() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            // 根據選擇設定初始狀態
            state.inventory = ["現金 HK$450"];
            
            if (config.family === 'solo') {
                state.water = 3.0; state.morale = 60;
                state.inventory.push("備用水 3L (獨居)");
            } else if (config.family === 'partner') {
                state.water = 5.0; state.morale = 85;
                state.inventory.push("備用水 5L (雙人)");
            } else { // parents
                state.water = 6.0; state.morale = 75;
                state.inventory.push("備用水 6L (家庭)");
            }

            goToNode("START");
        }

        const randomEvents = [
            { title: "🐾 走失的橘貓", desc: "在走廊遇到小貓，分了牠點餅乾，貓蹭了蹭你。士氣 +10%。", effect: () => state.morale = Math.min(100, state.morale + 10) },
            { title: "💧 幸運的發現", desc: "在後樓梯間發現一樽無人看管的 1.5L 水樽！", effect: () => { state.water += 1.5; addInventory("礦泉水 1.5L"); } },
            { title: "🍦 雪條大餐", desc: "家人拿出了快融化的雪條，大家開心吃完！士氣 +15%。", effect: () => state.morale = Math.min(100, state.morale + 15) },
            { title: "🌧️ 傾盆大雨", desc: "窗外下大雨，用桶接到了 3L 洗滌雨水！", effect: () => addInventory("雨水 3L") }
        ];

        const nodes = {
            START: {
                time: "DAY 1 - 23:00",
                text: () => {
                    let famText = config.family === 'solo' ? "你獨自一人坐在客廳。" : (config.family === 'partner' ? "你和伴侶相視無言。" : "你和父母圍坐在客廳。");
                    let floorText = config.floor === 'high' ? "居住在 25 樓的高層，窗外一片漆黑。" : "居住在 2 樓的低層，街上的嘈雜聲清晰可聞。";
                    return `全區突發大規模停電！${famText}${floorText}\n\n大廈水泵即將停運，隔壁陳太太敲門說街角 24 小時超市還有備用電，大家正在排隊搶購。你決定？`;
                },
                choices: [
                    { text: "A. 帶上現金下樓去超市搶購", target: "SUPERMARKET" },
                    { text: "B. 留在家中省用現有水糧", target: "WAIT_HOME" }
                ]
            },
            SUPERMARKET: {
                time: "DAY 1 - 23:45",
                text: () => {
                    let staminaLoss = config.floor === 'high' ? "（高樓層爬樓梯消耗了更多電量與體力）" : "";
                    return `你衝到超市，貨架幾乎被空。只剩最後一箱蒸餾水，一個中年男士懇求你讓給他。${staminaLoss}\n\n你決定？`;
                },
                choices: [
                    { text: "A. 堅持各分半箱水", target: "SHARE_WATER" },
                    { text: "B. 放棄水箱，改買黃桃罐頭與沙丁魚", target: "BUY_FOOD" }
                ],
                onEnter: () => {
                    if (config.floor === 'high') state.battery -= 15; // 高樓層扣更多電
                    else state.battery -= 5;
                }
            },
            SHARE_WATER: {
                time: "DAY 2 - 00:30", text: "你獲得了 3L 水與乾糧，返回家中。", choices: [{ text: "等待天亮", target: "RADIO_BROADCAST" }],
                onEnter: () => { state.water += 3; addInventory("蒸餾水 3L"); }
            },
            BUY_FOOD: {
                time: "DAY 2 - 00:30", text: "你買下了罐頭返家。罐頭含有豐富水分與熱量！", choices: [{ text: "等待天亮", target: "RADIO_BROADCAST" }],
                onEnter: () => { addInventory("黃桃罐頭"); addInventory("沙丁魚罐頭"); }
            },
            WAIT_HOME: {
                time: "DAY 2 - 01:00", text: "你選擇留在家中，水泵停止，全樓斷水。", choices: [{ text: "收聽廣播", target: "RADIO_BROADCAST" }]
            },
            RADIO_BROADCAST: {
                time: "DAY 2 - 01:15", text: "收音機廣播：『明日 8:00 將於足球場派出水車供水……』",
                choices: [
                    { text: "A. 明早 6:00 天未亮提早去排隊", target: "SOCCER_EARLY" },
                    { text: "B. 早上 7:30 再去排隊", target: "SOCCER_LATE" }
                ]
            },
            SOCCER_EARLY: {
                time: "DAY 2 - 08:00", text: "你提前抵達，水車旁爆發混亂！你在前排，決定？",
                choices: [
                    { text: "A. 趁亂接滿 10L 水迅速撤離", target: "WATER_SUCCESS" },
                    { text: "B. 退到旁邊觀望", target: "WATER_DELAY" }
                ]
            },
            SOCCER_LATE: {
                time: "DAY 2 - 08:30", text: "現場失控被封鎖，你只領到了 2L 水。", choices: [{ text: "返回大廈", target: "RETURN_BUILDING" }],
                onEnter: () => { state.water += 2; }
            },
            WATER_SUCCESS: {
                time: "DAY 2 - 09:15", text: "你成功拿到 10L 水！回到大堂遇見鄰居張先生，他想用電池與手電筒跟你換水或食物。",
                choices: [
                    { text: "A. 用黃桃罐頭 + 1L 水交換電池與手電筒", target: "BARTER_SUCCESS" },
                    { text: "B. 拒絕交換，直接回家", target: "RETURN_BUILDING" }
                ],
                onEnter: () => { state.water += 10; addInventory("純淨水 10L"); }
            },
            WATER_DELAY: {
                time: "DAY 2 - 09:30", text: "水很快分光，你只接到了 3L 水。", choices: [{ text: "返回大廈", target: "RETURN_BUILDING" }],
                onEnter: () => { state.water += 3; }
            },
            BARTER_SUCCESS: {
                time: "DAY 2 - 09:45", text: "你換到了 8 節 AA 電池與強光手電筒！", choices: [{ text: "回家防守", target: "HOME_DEFENSE" }],
                onEnter: () => { state.water -= 1; addInventory("AA電池x8"); addInventory("強光手電筒"); }
            },
            RETURN_BUILDING: {
                time: "DAY 2 - 12:00", text: "回到家中，氣溫升高，十分悶熱。", choices: [{ text: "等待下午", target: "HOME_DEFENSE" }]
            },
            HOME_DEFENSE: {
                time: "DAY 2 - 16:00",
                text: () => {
                    let floorWarning = config.floor === 'low' ? "（低樓層門口雜音特別明顯）" : "";
                    return `假志願者敲門要求登記糧水，發現對方口袋藏有硬物！${floorWarning}\n\n你決定？`;
                },
                choices: [
                    { text: "A. 保持肅靜假裝家中無人", target: "THIEF_NIGHT" },
                    { text: "B. 開門與對方對話", target: "BAD_END_1" }
                ]
            },
            THIEF_NIGHT: {
                time: "DAY 2 - 23:30",
                text: () => {
                    let soloNotice = config.family === 'solo' ? "（你獨自一人，正面對抗極度危險）" : "";
                    return `深夜走廊傳來撬鎖聲！賊人正在嘗試破門！${soloNotice}\n\n你決定？`;
                },
                choices: [
                    { text: "A. 大聲呼喊鄰居，聯手威嚇喊賊", target: "REPELS_THIEF" },
                    { text: "B. 保持沉默死守", target: "BAD_END_2" }
                ]
            },
            REPELS_THIEF: {
                time: "DAY 3 - 08:00", text: "嚇退賊人！第 3 天中學救援站成立發放物資。",
                choices: [{ text: "前往救援站", target: "RELIEF_STATION" }]
            },
            RELIEF_STATION: {
                time: "DAY 3 - 10:45", text: "順利領到乾糧與 30 片淨水片！",
                choices: [{ text: "帶物資回家落袋為安", target: "HAPPY_END" }],
                onEnter: () => { state.water += 3; addInventory("淨水片x30"); }
            },
            BAD_END_1: {
                time: "DAY 2 - 16:15", isEnding: true, rank: "F", title: "【BAD END 1：引狼入室】",
                desc: "你打開了門。匪徒破門而入搶光了所有物資，全家陷入絕境……"
            },
            BAD_END_2: {
                time: "DAY 2 - 23:45", isEnding: true, rank: "F", title: "【BAD END 2：孤立無援】",
                desc: "賊人破門而入，物資被劫掠一空，你在混亂中受傷……"
            },
            HAPPY_END: {
                time: "DAY 3 - 21:40", isEnding: true, rank: "S", title: "【PERFECT END：完美生存】",
                desc: "晚上 9:40，供電與通訊全面恢復！憑藉著果斷決策與鄰里互助，你順利度過了危機！"
            }
        };

        function addInventory(item) { if (!state.inventory.includes(item)) state.inventory.push(item); }

        function updateHUD() {
            document.getElementById('stat-water').innerText = state.water.toFixed(1) + " L";
            document.getElementById('stat-battery').innerText = state.battery + "%";
            document.getElementById('stat-morale').innerText = state.morale + "%";
            document.getElementById('stat-time').innerText = state.time;
            document.getElementById('time-badge').innerText = state.time;
            document.getElementById('inventory-list').innerHTML = state.inventory.map(i => `<span class="inv-tag">${i}</span>`).join('');
        }

        function goToNode(nodeKey) {
            state.currentNode = nodeKey;
            const node = nodes[nodeKey];
            state.time = node.time;
            if (node.onEnter) node.onEnter();
            updateHUD();

            document.getElementById('story-text').innerText = typeof node.text === 'function' ? node.text() : node.text;

            const eventContainer = document.getElementById('event-container');
            eventContainer.innerHTML = '';
            if (!node.isEnding && nodeKey !== 'START' && Math.random() < 0.3) {
                const ev = randomEvents[Math.floor(Math.random() * randomEvents.length)];
                ev.effect();
                eventContainer.innerHTML = `<div class="event-box"><div class="event-title">${ev.title}</div><div class="event-desc">${ev.desc}</div></div>`;
            }

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            if (node.isEnding) {
                document.getElementById('modal-rank').innerText = node.rank;
                document.getElementById('modal-title').innerText = node.title;
                document.getElementById('modal-desc').innerText = node.desc;
                document.getElementById('modal-overlay').style.display = 'flex';
            } else {
                node.choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = c.text;
                    btn.onclick = () => goToNode(c.target);
                    choicesContainer.appendChild(btn);
                });
            }
        }

        function resetToSetup() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
