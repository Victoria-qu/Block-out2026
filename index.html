<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 大停電：生存抉擇 (Blackout 2026)</title>
    <style>
        :root {
            --bg-color: #0a0d12;
            --panel-bg: #141923;
            --border-color: #2a3447;
            --text-main: #d1d5db;
            --text-bright: #f3f4f6;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .game-container {
            width: 100%;
            max-width: 720px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Setup Screen */
        .setup-screen {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setup-title {
            font-size: 1.5rem;
            color: var(--text-bright);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setup-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setup-label {
            font-size: 0.95rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .setup-options {
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(140px, 1fr) );
            gap: 10px;
        }

        .opt-card {
            background: #1e2636;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .opt-card.selected {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #fff;
            font-weight: bold;
        }

        .start-btn {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .start-btn:hover { background: #059669; }

        /* HUD Dashboard */
        .hud-header {
            background-color: #0f131c;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (min-width: 520px) {
            .hud-header {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-bright);
        }

        .stat-water { color: var(--accent-blue); }
        .stat-stamina { color: var(--accent-green); }
        .stat-defense { color: #f43f5e; }
        .stat-battery { color: var(--accent-amber); }

        /* Story & Event */
        .story-area {
            padding: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
        }

            align-self: flex-start;
            background: rgba(59, 130, 246, 0.1
