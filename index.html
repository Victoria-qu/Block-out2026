<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 大停電：生存抉擇</title>
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #181b20;
            --border-color: #2a2e37;
            --text-main: #d1d5db;
            --text-bright: #f3f4f6;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.6;
            padding: 12px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .game-container {
            width: 100%;
            max-width: 720px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
            margin-bottom: 20px;
        }

        header {
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 16px;
            text-align: center;
        }

        h1 {
            color: var(--accent-yellow);
            font-size: 1.4rem;
            letter-spacing: 1px;
        }

        /* Status HUD Styling */
        .hud-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 16px;
            font-size: 0.85rem;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
        }

        .hud-label {
            color: #8b92a1;
            font-size: 0.75rem;
        }

        .hud-value {
            color: var(--text-bright);
            font-weight: bold;
        }

        .hud-value.low { color: var(--accent-red); }
        .hud-value.medium { color: var(--accent-yellow); }
        .hud-value.good { color: var(--accent-green); }

        /* Story & Log Area */
        .system-msg {
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid var(--accent-blue);
            color: #93c5fd;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
        }

        .event-msg {
            background: rgba(245, 158, 11, 0.1);
            border-left: 3px solid var(--accent-yellow);
            color: #fde68a;
            padding: 8px 12px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            border-radius: 0 4px 4px 0;
        }

        .story-text {
            font-size: 1rem;
            color: var(--text-bright);
            margin-bottom: 20px;
            white-space: pre-line;
        }

        /* Tension Atmosphere Box */
        .tension-box {
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid var(--accent-red);
            padding: 14px;
            border-radius: 4px;
            margin-bottom: 16px;
            font-style: italic;
            color: #fca5a5;
            font-size: 0.95rem;
        }

        /* Options Area */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            background: #22262e;
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .btn:hover {
            background: #2d333f;
            border-color: var(--accent-yellow);
        }

        .btn:active {
            transform: scale(0.99);
        }

        .btn-restart {
            background: var(--accent-red);
            color: #ffffff;
            font-weight: bold;
            text-align: center;
            border: none;
            margin-top: 10px;
        }

        .btn-restart:hover {
            background: #dc2626;
        }

        .report-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid var(--accent-yellow);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .report-title {
            color: var(--accent-yellow);
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
        }

        .grade-badge {
            display: inline-block;
            font-size: 2rem;
            font-weight: bold;
            padding: 4px 16px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .grade-S { color: #10b981; border: 2px solid #10b981; }
        .grade-B { color: #3b82f6; border: 2px solid #3b82f6; }
        .grade-F { color: #ef4444; border: 2px solid #ef4444; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <header>
        <h1>📜 2026 大停電：生存抉擇</h1>
    </header>

    <!-- Status HUD -->
    <div id="hud" class="hud-grid hidden">
        <div class="hud-item">
            <span class="hud-label">飲用水</span>
            <span id="hud-water" class="hud-value">0 L</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">體力</span>
            <span id="hud-stamina" class="hud-value">100%</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">防禦能力</span>
            <span id="hud-defense" class="hud-value">30%</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">手機電量</span>
            <span id="hud-phone" class="hud-value">100%</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">家人士氣</span>
            <span id="hud-morale" class="hud-value">100%</span>
        </div>
        <div class="hud-item">
            <span class="hud-label">時間線</span>
            <span id="hud-time" class="hud-value">DAY 1 23:00</span>
        </div>
        <div class="hud-item" style="grid-column: 1 / -1;">
            <span class="hud-label">背包物資</span>
            <span id="hud-items" class="hud-value" style="font-size: 0.8rem; font-weight: normal;">無</span>
        </div>
    </div>

    <!-- Message Logs -->
    <div id="system-log" class="system-msg hidden"></div>
    <div id="event-log" class="event-msg hidden"></div>

    <!-- Main Content -->
    <div id="story-display" class="story-text"></div>

    <!-- Options Container -->
    <div id="options-display" class="options-container"></div>
</div>

<script>
    // Game State Object
    let gameState = {
        family: null,       // 'single', 'partner', 'parents'
        floor: null,        // 2 or 25
        water: 0,
        stamina: 100,
        defense: 30,
        phone: 100,
        morale: 100,
        day: 1,
        hour: 23,
        minute: 0,
        items: [],
        hasRadio: false,
        hasSentSMS: false,
        currentNode: 'START_FAMILY'
    };

    const familyConfig = {
        'single': { name: '獨居', water: 4, defense: 30, decayWater: 0.5, moraleDecay: 2 },
        'partner': { name: '伴侶同住', water: 7, defense: 65, decayWater: 1.0, moraleDecay: 5 },
        'parents': { name: '父母同住', water: 10, defense: 80, decayWater: 1.5, moraleDecay: 8 }
    };

    const luckyEvents = [
        { text: "幸運插曲：你在櫃底找到一瓶未開啟的 1L 礦泉水！", effect: state => { state.water += 1; } },
        { text: "幸運插曲：你發現了一隻走失的橘貓在門外徘徊，安撫牠後心境稍微平靜，士氣 +10%。", effect: state => { state.morale = Math.min(100, state.morale + 10); } },
        { text: "幸運插曲：趁著雪糕融化前，你吃掉了一條雪條，體力 +5%，士氣 +5%。", effect: state => { state.stamina = Math.min(100, state.stamina + 5); state.morale = Math.min(100, state.morale + 5); } },
        { text: "幸運插曲：外面下起傾盆大雨，你成功用容器收集到一些清潔雨水，飲用水 +2L。", effect: state => { state.water += 2; } },
        { text: "幸運插曲：在備用物資箱翻出一罐菠蘿罐頭！體力 +5%，士氣 +10%。", effect: state => { state.stamina = Math.min(100, state.stamina + 5); state.morale = Math.min(100, state.morale + 10); state.items.push("菠蘿罐頭"); } }
    ];

    // Format Utilities
    function formatTime(day, hour, minute) {
        const h = String(hour).padStart(2, '0');
        const m = String(minute).padStart(2, '0');
        return `DAY ${day} ${h}:${m}`;
    }

    function updateHUD() {
        if (!gameState.family || !gameState.floor) {
            document.getElementById('hud').classList.add('hidden');
            return;
        }
        document.getElementById('hud').classList.remove('hidden');

        document.getElementById('hud-water').textContent = `${gameState.water.toFixed(1)} L`;
        
        const staminaEl = document.getElementById('hud-stamina');
        staminaEl.textContent = `${Math.round(gameState.stamina)}%`;
        staminaEl.className = `hud-value ${gameState.stamina < 30 ? 'low' : gameState.stamina < 60 ? 'medium' : 'good'}`;

        document.getElementById('hud-defense').textContent = `${gameState.defense}%`;
        
        const phoneEl = document.getElementById('hud-phone');
        phoneEl.textContent = `${Math.round(gameState.phone)}%`;
        phoneEl.className = `hud-value ${gameState.phone < 20 ? 'low' : gameState.phone < 50 ? 'medium' : 'good'}`;

        document.getElementById('hud-morale').textContent = `${Math.round(gameState.morale)}%`;
        document.getElementById('hud-time').textContent = formatTime(gameState.day, gameState.hour, gameState.minute);
        
        const itemText = gameState.items.length > 0 ? gameState.items.join(', ') : '無';
        document.getElementById('hud-items').textContent = itemText;
    }

    function advanceTime(hours, mins = 0, activityStaminaCost = 0) {
        let systemLog = [];
        
        // Time calculation
        gameState.minute += mins;
        if (gameState.minute >= 60) {
            gameState.hour += Math.floor(gameState.minute / 60);
            gameState.minute %= 60;
        }
        gameState.hour += hours;
        if (gameState.hour >= 24) {
            gameState.day += Math.floor(gameState.hour / 24);
            gameState.hour %= 24;
        }

        // Water Decay based on hours fraction
        const totalHours = hours + (mins / 60);
        const config = familyConfig[gameState.family];
        const waterUsed = (config.decayWater / 24) * totalHours * 1.5;
        gameState.water = Math.max(0, gameState.water - waterUsed);
        systemLog.push(`時間流逝 ${hours > 0 ? hours + '小時' : ''}${mins > 0 ? mins + '分鐘' : ''}，消耗飲用水 ${waterUsed.toFixed(2)}L。`);

        // Stamina Decay
        let floorFactor = gameState.floor === 25 ? 1.5 : 1.0;
        let totalStaminaCost = activityStaminaCost * floorFactor;
        if (totalStaminaCost > 0) {
            gameState.stamina = Math.max(0, gameState.stamina - totalStaminaCost);
            systemLog.push(`行動消耗體力 ${Math.round(totalStaminaCost)}%${gameState.floor === 25 ? '（高樓層額外負擔）' : ''}。`);
        }

        // Morale Decay
        const moraleLoss = (config.moraleDecay / 24) * totalHours;
        gameState.morale = Math.max(0, gameState.morale - moraleLoss);

        // Check Trigger Lucky Event (30% Chance)
        let luckyMsg = null;
        if (Math.random() < 0.3) {
            const ev = luckyEvents[Math.floor(Math.random() * luckyEvents.length)];
            ev.effect(gameState);
            luckyMsg = ev.text;
        }

        // Display logs
        const sysEl = document.getElementById('system-log');
        sysEl.textContent = systemLog.join(' ');
        sysEl.classList.remove('hidden');

        const evEl = document.getElementById('event-log');
        if (luckyMsg) {
            evEl.textContent = luckyMsg;
            evEl.classList.remove('hidden');
        } else {
            evEl.classList.add('hidden');
        }

        // Check Death Condition
        if (gameState.water <= 0 || gameState.stamina <= 0) {
            renderNode('BAD_END_EXHAUSTION');
            return false;
        }

        return true;
    }

    // Target Time Jump Helper
    function jumpToTime(targetDay, targetHour, targetMin, activityStaminaCost = 0) {
        let currentTotalMins = (gameState.day * 24 * 60) + (gameState.hour * 60) + gameState.minute;
        let targetTotalMins = (targetDay * 24 * 60) + (targetHour * 60) + targetMin;
        let diffMins = targetTotalMins - currentTotalMins;

        if (diffMins < 0) diffMins = 0;
        let hours = Math.floor(diffMins / 60);
        let mins = diffMins % 60;

        return advanceTime(hours, mins, activityStaminaCost);
    }

    function renderNode(nodeKey) {
        gameState.currentNode = nodeKey;
        updateHUD();

        const storyEl = document.getElementById('story-display');
        const optsEl = document.getElementById('options-display');
        optsEl.innerHTML = '';

        const node = storyNodes[nodeKey];
        if (!node) return;

        if (node.onEnter) {
            node.onEnter();
        }

        updateHUD();
        storyEl.innerHTML = typeof node.text === 'function' ? node.text() : node.text;

        if (node.options) {
            node.options.forEach(opt => {
                if (opt.condition && !opt.condition()) return;

                const btn = document.createElement('button');
                btn.className = `btn ${opt.isRestart ? 'btn-restart' : ''}`;
                btn.innerHTML = opt.label;
                btn.onclick = () => {
                    if (opt.action) opt.action();
                };
                optsEl.appendChild(btn);
            });
        }
    }

    // Story Decision Tree
    const storyNodes = {
        START_FAMILY: {
            text: `📜 <b>【開局設定：第一步】</b>\n\n2026年盛夏深夜，香港突發原因不明的極限全港大停電。瞬間冷氣停轉、燈光熄滅、網絡訊號全無，窗外陷入一片死寂與嘈雜的混亂中。\n\n請選擇你的<b>「家人組合」</b>：`,
            options: [
                {
                    label: "🏠 <b>獨居</b>",
                    action: () => {
                        gameState.family = 'single';
                        gameState.water = familyConfig.single.water;
                        gameState.defense = familyConfig.single.defense;
                        renderNode('START_FLOOR');
                    }
                },
                {
                    label: "👥 <b>伴侶同住</b>",
                    action: () => {
                        gameState.family = 'partner';
                        gameState.water = familyConfig.partner.water;
                        gameState.defense = familyConfig.partner.defense;
                        renderNode('START_FLOOR');
                    }
                },
                {
                    label: "👨‍👩‍👧 <b>父母同住</b>",
                    action: () => {
                        gameState.family = 'parents';
                        gameState.water = familyConfig.parents.water;
                        gameState.defense = familyConfig.parents.defense;
                        renderNode('START_FLOOR');
                    }
                }
            ]
        },

        START_FLOOR: {
            text: () => `📜 <b>【開局設定：第二步】</b>\n\n設定：${familyConfig[gameState.family].name} | 初始水源：${gameState.water}L | 初始防禦：${gameState.defense}%\n\n請選擇你的<b>「居住樓層」</b>：`,
            options: [
                {
                    label: "🏢 <b>低樓層 (2樓)</b>",
                    action: () => {
                        gameState.floor = 2;
                        renderNode('DAY1_START');
                    }
                },
                {
                    label: "🏙️ <b>高樓層 (25樓)</b>",
                    action: () => {
                        gameState.floor = 25;
                        renderNode('DAY1_START');
                    }
                }
            ]
        },

        DAY1_START: {
            text: () => `<b>【DAY 1 23:00 - 大停電爆發】</b>\n\n全港瞬間陷入漆黑。外面的車聲混亂，遙遠處傳來警笛聲隨即熄滅。住宅區氣溫極速上升，手機訊號顯示「無服務」。\n\n你站在客廳，身邊只有緊急手電筒發出微弱的光。面對突如其來的極限災難，第一步你打算怎麼做？`,
            options: [
                {
                    label: "📻 <b>選項 A：尋找乾電收音機收聽廣播</b>",
                    action: () => {
                        gameState.hasRadio = true;
                        if (!advanceTime(1, 0, 5)) return;
                        renderNode('DAY1_RADIO_SUCCESS');
                    }
                },
                {
                    label: "📱 <b>選項 B：不找收音機，希望快快恢復網絡並原地等候</b>",
                    action: () => {
                        gameState.hasRadio = false;
                        if (!advanceTime(2, 0, 0)) return;
                        renderNode('DAY1_WAIT_NETWORK');
                    }
                }
            ]
        },

        DAY1_RADIO_SUCCESS: {
            text: `你翻箱倒櫃，終於在舊物箱找到一部吃三號電池的古董收音機。調校頻率後，傳來港府民政事務總署的緊急廣播：\n\n<i>『……全港電網遭受未明原因嚴重故障，復電時間未知。請市民保持冷靜，留守室內。明日下午14:00起，水務處將於各區指定地點安排臨時水車配給……』</i>\n\n獲得關鍵情報！你對未來的混亂有了心理準備。`,
            options: [
                {
                    label: "🌙 <b>進入夜間休息，準備明日下午去取水</b>",
                    action: () => {
                        let rec = gameState.stamina + 35 > 100 ? 100 - gameState.stamina : 35;
                        gameState.stamina = Math.min(100, gameState.stamina + 35);
                        document.getElementById('system-log').textContent = `夜間休息：體力恢復 +${Math.round(rec)}%。`;
                        if (!jumpToTime(2, 14, 0)) return;
                        renderNode('DAY2_WATER_FETCH');
                    }
                }
            ]
        },

        DAY1_WAIT_NETWORK: {
            text: `你坐在沙發上不斷刷新手機，電量一點一滴流逝，但訊號始終是「無服務」。一直到深夜，室內悶熱如蒸籠，外面開始傳來零星破壞與爭吵聲。\n\n你錯過了官方廣播，對外界資訊一無所知，士氣有所下降。`,
            options: [
                {
                    label: "🌙 <b>實在撐不住了，睡覺休息</b>",
                    action: () => {
                        let rec = gameState.stamina + 30 > 100 ? 100 - gameState.stamina : 30;
                        gameState.stamina = Math.min(100, gameState.stamina + 30);
                        gameState.morale = Math.max(0, gameState.morale - 10);
                        document.getElementById('system-log').textContent = `夜間休息：體力恢復 +${Math.round(rec)}%，因焦慮士氣 -10%。`;
                        if (!jumpToTime(2, 13, 0)) return;
                        renderNode('DAY2_NO_RADIO_CHOICE');
                    }
                }
            ]
        },

        DAY2_NO_RADIO_CHOICE: {
            text: `<b>【DAY 2 13:00 - 資訊匱乏的抉擇】</b>\n\n到了翌日中午，家中儲水消耗不少。你沒有收音機資訊，不知道街上情況。`,
            options: [
                {
                    label: "🏠 <b>選擇 A：留守家中，節省體力</b>",
                    action: () => {
                        if (!jumpToTime(2, 16, 0)) return;
                        renderNode('DAY2_PRE_SECURITY');
                    }
                },
                {
                    label: "🛒 <b>選擇 B：出外搶購/碰運氣尋找物資</b>",
                    action: () => {
                        let staminaLoss = gameState.floor === 25 ? 25 : 12;
                        if (!jumpToTime(2, 16, 0, staminaLoss)) return;
                        gameState.water += 2;
                        gameState.items.push("餅乾");
                        renderNode('DAY2_PRE_SECURITY_AFTER_LOOT');
                    }
                }
            ]
        },

        DAY2_WATER_FETCH: {
            text: `<b>【DAY 2 14:00 - 水務處水車取水現場】</b>\n\n你憑著廣播情報來到屋邨廣場的水車前。現場已經排滿數百名憤怒又口渴的街坊，現場沒有警察維持秩序，情況非常混亂，甚至有人開打搶奪水樽。\n\n你要如何行動？`,
            options: [
                {
                    label: "💪 <b>選擇 A：混亂中憑體力硬搶高位取水</b>",
                    action: () => {
                        gameState.water += 8;
                        if (!jumpToTime(2, 16, 0, 30)) return;
                        renderNode('DAY2_PRE_SECURITY');
                    }
                },
                {
                    label: "⏳ <b>選擇 B：靜待搗亂份子散去才安全排隊</b>",
                    action: () => {
                        gameState.water += 3;
                        if (!jumpToTime(2, 16, 0, 5)) return;
                        renderNode('DAY2_PRE_SECURITY');
                    }
                },
                {
                    label: "🏃 <b>選擇 C：見情況混亂，放棄取水轉去附近小店探購</b>",
                    action: () => {
                        gameState.water += 1.5;
                        gameState.items.push("罐頭糧食");
                        if (!jumpToTime(2, 16, 0, 15)) return;
                        renderNode('DAY2_PRE_SECURITY');
                    }
                }
            ]
        },

        DAY2_PRE_SECURITY_AFTER_LOOT: {
            text: `你冒險出外，街上店舖大多關門或被砸破。你幸運地在一間雜貨店餘燼中搶購到 2L 飲用水與一包餅乾，但體力消耗甚大。你急忙返回家中鎖緊大門。`,

            options: [
                {
                    label: "🤫 <b>選項 A：靜默不回應</b>",

                {

                    action: () => {
                        gameState.hasSentSMS = true;
                        gameState.phone = Math.max(0, gameState.phone - 2);

                    }

                {

        DAY2_TENSION_TRANSITION: {
            text: `<b>【DAY 2 17:00 ~ 23:00 - 窒息的等待】</b>\n\n<div class="tension-box">『滴答……滴答……』\n無電的客廳只剩下牆上舊掛鐘的秒針聲。室內氣溫居高不下，汗水浸透了襯衫。外面的走廊寂靜得可怕，連平時常見的狗吠聲都消失了。\n\n你背靠著大門坐在地上，手裡緊緊握著準備好的硬物工具，每一次樓梯間傳來的微弱異響，都讓你的心跳猛烈加速。你知道，傍晚那兩個人絕不會罷休，今晚注定是一場生死較量……</div>\n夜幕徹底低垂， dark 吞噬了整座大廈。`,

                    }

            ]
        },

        // Stage 2 Night Break-in
        DAY2_SECURITY_STAGE2: {

            options: [
                {
                    label: "📢 <b>選項 A：大聲向鄰居呼救</b>",

                    action: () => {

                            gameState.stamina -= 30;
                            renderNode('WOUNDED_SURVIVAL');
                        } else {
                            renderNode('BAD_END_BREAK_IN_FAIL');
                        }
                    }
                },
                {
                    label: "🤬 <b>選項 C：大聲罵賊並奮力擋門</b>",
                    action: () => {
                        if (gameState.stamina >= 60) {
                            gameState.stamina -= 30;
                            renderNode('WOUNDED_SURVIVAL');
                        } else {

                }
            ]
        },

        GOOD_END_COMMUNITY: {
            text: `<b>【GOOD END：社區互助巡邏隊】</b>\n\n你立刻大聲喊向對面的張先生。張先生是退休警察，早已戒備，聽到呼救後立刻手持木棒衝出，同時大聲敲響走廊消防警報！\n\n兩名賊人被突如其來的混亂嚇得倉皇逃跑。經此一役，張先生發起組織大廈居民成立「自衛巡邏隊」，輪流守護各樓層。第4天政府搶修成功恢復部分電力，你與家人安全度過了這場大停電！`,
            onEnter: () => renderReport('S', '完美生存（S級）', '成功善用社區鄰里資源，以最小代價擊退賊人，並建立穩固防線。'),
            options: [{ label: "🔄 <b>重新開始遊戲</b>", isRestart: true, action: resetGame }]
        },

        PERFECT_END: {
            text: `<b>【PERFECT END：完美的戰術擊退】</b>\n\n你大聲呼救！由於你先前已傳送 SMS 簡訊予張先生，張先生早已備戰。他收到聲音後第一時間聯同另外兩位鄰居持工具衝出走廊，前後包抄！\n\n賊人見狀慌忙扔下撬棍落荒而逃。你與鄰居成功守住家園，並維持良好的體力與物資，順利熬過停電危機直至救援到來！`,
            onEnter: () => renderReport('S', '完美戰術通關（S級）', '冷靜應對，佈局周密，充分發揮了通訊與鄰里互助的力量。'),

            onEnter: () => renderReport('B', '負傷生還（B級）', '靠著個人頑強體魄死守家園，雖然付出受傷代價，但最終成功生存。'),

        BAD_END_NEIGHBOR_TOO_LATE: {

            text: `<b>【BAD END：身體衰竭】</b>\n\n在極限高溫與無電環境下，你的飲用水或體力已經完全耗盡（降至 0%）。\n\n你的意識開始模糊，體溫過高引發嚴重中暑與脫水，最終在孤立無援的漆黑單位內失去知覺……`,
            onEnter: () => renderReport('F', '生理衰竭（F級）', '未能有效管理關鍵資源（水分/體力），在災難初期即告生理崩潰。'),

        }
    };

    function renderReport(grade, title, desc) {
        const storyEl = document.getElementById('story-display');
        const reportHTML = `
            <div class="report-card">
                <div class="report-title">📋 生存評估報告</div>
                <div style="text-align:center;">
                    <span class="grade-badge grade-${grade}">${grade} 級</span>
                </div>
                <p><b>結局評級：</b>${title}</p>
                <p style="margin-top:8px; font-size:0.9rem; color:#d1d5db;"><b>分析評語：</b>${desc}</p>
                <hr style="border-color:var(--border-color); margin:12px 0;">
                <p style="font-size:0.85rem;"><b>最終狀態統計：</b></p>
                <ul style="font-size:0.85rem; padding-left:20px; margin-top:4px;">
                    <li>剩餘水份：${gameState.water.toFixed(1)} L</li>
                    <li>剩餘體力：${Math.round(gameState.stamina)}%</li>
                    <li>家人士氣：${Math.round(gameState.morale)}%</li>
                    <li>存活時間：${formatTime(gameState.day, gameState.hour, gameState.minute)}</li>
                </ul>
            </div>
        `;
        storyEl.innerHTML = reportHTML + storyEl.innerHTML;
    }

    function resetGame() {
        gameState = {
            family: null,
            floor: null,
            water: 0,
            stamina: 100,
            defense: 30,
            phone: 100,
            morale: 100,
            day: 1,
            hour: 23,
            minute: 0,
            items: [],
            hasRadio: false,
            hasSentSMS: false,
            currentNode: 'START_FAMILY'
        };
        document.getElementById('system-log').classList.add('hidden');
        document.getElementById('event-log').classList.add('hidden');
        renderNode('START_FAMILY');
    }

    // Initialize Game
    window.onload = () => {
        renderNode('START_FAMILY');
    };
</script>
