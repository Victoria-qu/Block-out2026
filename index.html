<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 大停電：生存抉擇 (Blackout 2026)</title>
    <style>
        :root {
            --bg-color: #0a0d12;
            --panel-bg: #141923;
            --border-color: #2a3447;
            --text-main: #d1d5db;
            --text-bright: #f3f4f6;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .game-container {
            width: 100%;
            max-width: 720px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Setup Screen */
        .setup-screen {
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .setup-title {
            font-size: 1.5rem;
            color: var(--text-bright);
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .setup-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setup-label {
            font-size: 0.95rem;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .setup-options {
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(140px, 1fr) );
            gap: 10px;
        }

        .opt-card {
            background: #1e2636;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .opt-card.selected {
            border-color: var(--accent-green);
            background: rgba(16, 185, 129, 0.15);
            color: #fff;
            font-weight: bold;
        }

        .start-btn {
            background: var(--accent-green);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .start-btn:hover { background: #059669; }

        /* HUD Dashboard */
        .hud-header {
            background-color: #0f131c;
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (min-width: 520px) {
            .hud-header {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-bright);
        }

        .stat-water { color: var(--accent-blue); }
        .stat-stamina { color: var(--accent-green); }
        .stat-defense { color: #f43f5e; }
        .stat-battery { color: var(--accent-amber); }

        /* Story & Event */
        .story-area {
            padding: 24px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
        }

        .time-badge {
            align-self: flex-start;
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent-blue);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .story-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--text-bright);
            white-space: pre-line;
        }

        .decay-box {
            margin-top: 12px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid var(--accent-red);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #fca5a5;
        }

        .rest-box {
            margin-top: 12px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-left: 4px solid var(--accent-green);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #6ee7b7;
        }

        .event-box {
            margin-top: 15px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-left: 4px solid var(--accent-purple);
            padding: 12px 15px;
            border-radius: 6px;
            animation: fadeIn 0.4s ease-out;
        }

        .event-title { color: var(--accent-purple); font-weight: 700; font-size: 0.9rem; margin-bottom: 4px; }
        .event-desc { font-size: 0.95rem; color: #ddd6fe; }

        /* Inventory */
        .inventory-bar {
            padding: 10px 24px;
            background: #0f131c;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow-x: auto;
        }

        .inventory-title { color: #6b7280; font-weight: 600; white-space: nowrap; }
        .inventory-items { display: flex; gap: 8px; flex-wrap: nowrap; }
        .inv-tag { background: #1f2937; border: 1px solid #374151; padding: 2px 8px; border-radius: 4px; color: #d1d5db; white-space: nowrap; }

        /* Choices */
        .choices-area {
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #121722;
        }

        .choice-btn {
            background: #1e2636;
            color: var(--text-bright);
            border: 1px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 0.98rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.4;
        }

        .choice-btn:hover { background: #283348; border-color: var(--accent-blue); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center; align-items: center;
            padding: 20px; z-index: 100;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            max-width: 500px; width: 100%;
            padding: 24px; text-align: center;
        }

        .rank-badge { font-size: 3.5rem; font-weight: 900; margin: 10px 0; }
        .rank-s { color: var(--accent-green); }
        .rank-b { color: var(--accent-amber); }
        .rank-f { color: var(--accent-red); }

        .modal-title { font-size: 1.5rem; color: var(--text-bright); margin-bottom: 8px; }
        .modal-desc { color: #9ca3af; font-size: 0.95rem; line-height: 1.6; margin-bottom: 20px; }

        .restart-btn {
            background: var(--accent-blue);
            color: #fff; border: none; padding: 12px 24px;
            border-radius: 6px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- 開局設定畫面 -->
        <div id="setup-screen" class="setup-screen">
            <h2 class="setup-title">🏠 生存開局設定</h2>

            <div class="setup-group">
                <span class="setup-label">1. 家人組合 (影響自然水糧消耗速度與防禦力)</span>
                <div class="setup-options">
                    <div class="opt-card selected" onclick="selectFamily('solo', this)">👤 獨居</div>
                    <div class="opt-card" onclick="selectFamily('partner', this)">👩‍❤️‍👨 伴侶同住</div>
                    <div class="opt-card" onclick="selectFamily('parents', this)">👨‍👩‍👦 父母同住</div>
                </div>
            </div>

            <div class="setup-group">
                <span class="setup-label">2. 居住樓層 (影響體力消耗速度與安全風險)</span>
                <div class="setup-options">
                    <div class="opt-card selected" onclick="selectFloor('low', this)">🏢 低樓層 (2樓)</div>
                    <div class="opt-card" onclick="selectFloor('high', this)">🏙️ 高樓層 (25樓)</div>
                </div>
            </div>

            <button class="start-btn" onclick="initGame()">啟動大停電生存模擬</button>
        </div>

        <!-- 遊戲主介面 -->
        <div id="game-screen" style="display: none;">
            <div class="hud-header">
                <div class="stat-card">
                    <span class="stat-label">飲用水</span>
                    <span id="stat-water" class="stat-value stat-water">4.0 L</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">個人體力</span>
                    <span id="stat-stamina" class="stat-value stat-stamina">100%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">防禦能力</span>
                    <span id="stat-defense" class="stat-value stat-defense">30%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">手機電量</span>
                    <span id="stat-battery" class="stat-value stat-battery">68%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">士氣值</span>
                    <span id="stat-morale" class="stat-value">80%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">時間線</span>
                    <span id="stat-time" class="stat-value" style="font-size: 0.85rem;">DAY 1 23:00</span>
                </div>
            </div>

            <div class="inventory-bar">
                <span class="inventory-title">背包物資:</span>
                <div id="inventory-list" class="inventory-items"></div>
            </div>

            <div class="story-area">
                <div id="time-badge" class="time-badge">DAY 1 - 23:00</div>
                <div id="story-text" class="story-text"></div>
                <div id="decay-container"></div>
                <div id="event-container"></div>
            </div>

            <div id="choices-container" class="choices-area"></div>
        </div>
    </div>

    <!-- 結局彈窗 -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div id="modal-rank" class="rank-badge">S</div>
            <h2 id="modal-title" class="modal-title">生存評估報告</h2>
            <p id="modal-desc" class="modal-desc"></p>
            <button class="restart-btn" onclick="resetToSetup()">重新選擇開局設定</button>
        </div>
    </div>

    <script>
        let config = { family: 'solo', floor: 'low' };
        let state = { 
            water: 4.0, stamina: 100, defense: 30, battery: 68, morale: 80, 
            time: "DAY 1 23:00", currentNode: "START",
            hasSentSMS: false 
        };

        function selectFamily(val, el) {
            config.family = val;
            el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectFloor(val, el) {
            config.floor = val;
            el.parentElement.querySelectorAll('.opt-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
        }

        function initGame() {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';

            state.inventory = ["現金 HK$450"];
            state.stamina = 100;
            state.hasSentSMS = false;
            
            if (config.family === 'solo') {
                state.water = 3.0; state.defense = 30; state.morale = 60;
                state.inventory.push("備用水 3L (獨居)");
            } else if (config.family === 'partner') {
                state.water = 5.0; state.defense = 65; state.morale = 85;
                state.inventory.push("備用水 5L (雙人)");
            } else { 
                state.water = 6.0; state.defense = 80; state.morale = 75;
                state.inventory.push("備用水 6L (家庭)");
            }

            goToNode("START");
        }

        function applyTimeDecay(nodeKey) {
            if (nodeKey === 'START') return null;

            const isRestNode = ['SHARE_WATER', 'BUY_FOOD', 'WAIT_HOME', 'RETURN_BUILDING'].includes(nodeKey);

            if (isRestNode) {
                let recovery = Math.floor(Math.random() * 21) + 30;
                state.stamina = Math.min(100, state.stamina + recovery);
                let waterRate = config.family === 'solo' ? 0.2 : 0.5;
                state.water = Math.max(0, state.water - waterRate);

                return { type: 'rest', msg: `🌙 經過夜間等候與休息：體力恢復 +${recovery}% | 飲用水 -${waterRate}L` };
            } else {
                let waterRate = config.family === 'solo' ? 0.3 : 0.6;
                let staminaRate = config.floor === 'high' ? 12 : 6;
                let moraleRate = 4;

                state.water = Math.max(0, state.water - waterRate);
                state.stamina = Math.max(0, state.stamina - staminaRate);
                state.morale = Math.max(0, state.morale - moraleRate);

                return { type: 'decay', msg: `⏳ 時間流逝：飲用水 -${waterRate}L | 體力 -${staminaRate}% | 士氣 -${moraleRate}%` };
            }
        }

        function getRandomEvent() {
            const events = [
                { title: "🐾 走失的橘貓", desc: "在走廊遇到小貓，分了牠點餅乾。士氣 +10%、體力 +5%。", effect: () => { state.morale = Math.min(100, state.morale + 10); state.stamina = Math.min(100, state.stamina + 5); } },
                { title: "💧 幸運的發現", desc: "發現一樽無人看管的 1.5L 水樽！體力 +5%。", effect: () => { state.water += 1.5; state.stamina = Math.min(100, state.stamina + 5); addInventory("礦泉水 1.5L"); } },
                { 
                    title: "🍦 雪糕驚喜", 
                    desc: config.family === 'solo' 
                        ? "你趁雪櫃解凍前吃完了雪糕！士氣 +15%、體力 +5%。" 
                        : "家人拿出快融化的雪條分著吃完！士氣 +15%、體力 +5%。", 
                    effect: () => { state.morale = Math.min(100, state.morale + 15); state.stamina = Math.min(100, state.stamina + 5); } 
                },
                { title: "🌧️ 傾盆大雨", desc: "窗外下大雨，接到了 3L 雨水！體力 +5%。", effect: () => { state.stamina = Math.min(100, state.stamina + 5); addInventory("雨水 3L"); } }
            ];
            return events[Math.floor(Math.random() * events.length)];
        }

        const nodes = {
            START: {
                time: "DAY 1 - 23:00",
                text: () => {
                    let famText = config.family === 'solo' ? "你獨自一人坐在黑暗的客廳。" : (config.family === 'partner' ? "你和伴侶相視無言。" : "你和父母圍坐在客廳。");
                    let floorText = config.floor === 'high' ? "居住在 25 樓的高層，爬樓梯極耗體力。" : "居住在 2 樓的低層，進出便利但較易受騷擾。";
                    return `全區突發大規模停電！${famText}${floorText}\n\n大廈水泵即將停運，隔壁陳太太敲門說街角 24 小時超市還有備用電，大家正在排隊搶購。你決定？`;
                },
                choices: [
                    { text: "A. 帶上現金下樓去超市搶購", target: "SUPERMARKET" },
                    { text: "B. 留在家中省用現有水糧", target: "WAIT_HOME" }
                ]
            },
            SUPERMARKET: {
                time: "DAY 1 - 23:45",
                text: () => {
                    let staminaText = config.floor === 'high' ? "（高樓層往返讓你額外消耗了更多體力與手機電量）" : "（低樓層輕鬆到達，體力消耗較小）";
                    return `你衝到超市，貨架幾乎被空。只剩最後一箱蒸餾水，一個中年男士懇求你讓給他。${staminaText}\n\n你決定？`;
                },
                choices: [
                    { text: "A. 堅持各分半箱水", target: "SHARE_WATER" },
                    { text: "B. 放棄水箱，改買黃桃罐頭與沙丁魚", target: "BUY_FOOD" }
                ],
                onEnter: () => {
                    if (config.floor === 'high') { state.stamina -= 15; state.battery -= 10; }
                    else { state.stamina -= 5; state.battery -= 5; }
                }
            },
            SHARE_WATER: {
                time: "DAY 2 - 00:30", text: "你獲得了 3L 水與乾糧返家休養。", choices: [{ text: "休息等待天亮", target: "RADIO_BROADCAST" }],
                onEnter: () => { state.water += 3; addInventory("蒸餾水 3L"); }
            },
            BUY_FOOD: {
                time: "DAY 2 - 00:30", text: "你買下了罐頭返家休養。罐頭含有豐富水分與熱量！", choices: [{ text: "休息等待天亮", target: "RADIO_BROADCAST" }],
                onEnter: () => { addInventory("黃桃罐頭"); addInventory("沙丁魚罐頭"); }
            },
            WAIT_HOME: {
                time: "DAY 2 - 01:00", text: "你選擇留在家中休息，水泵停止，全樓斷水。", choices: [{ text: "收聽廣播", target: "RADIO_BROADCAST" }]
            },
            RADIO_BROADCAST: {
                time: "DAY 2 - 01:15", text: "收音機廣播：『明日 8:00 將於足球場派出水車供水……』",
                choices: [
                    { text: "A. 明早 6:00 天未亮提早去排隊", target: "SOCCER_EARLY" },
                    { text: "B. 早上 7:30 再去排隊", target: "SOCCER_LATE" }
                ]
            },
            SOCCER_EARLY: {
                time: "DAY 2 - 08:00", text: "你提前抵達，水車旁爆發混亂！你在前排，決定？",
                choices: [
                    { text: "A. 趁亂接滿 10L 水迅速撤離", target: "WATER_SUCCESS" },
                    { text: "B. 退到旁邊觀望", target: "WATER_DELAY" }
                ]
            },
            SOCCER_LATE: {
                time: "DAY 2 - 08:30", text: "現場失控被封鎖，你耗費巨量體力只領到了 2L 水。", choices: [{ text: "返回大廈", target: "RETURN_BUILDING" }],
                onEnter: () => { state.water += 2; state.stamina -= 15; }
            },
            WATER_SUCCESS: {
                time: "DAY 2 - 09:15", text: "你成功拿到 10L 水！回到大堂遇見鄰居張先生，他想用電池與手電筒跟你換水或食物。",
                choices: [
                    { text: "A. 用黃桃罐頭 + 1L 水交換電池與手電筒", target: "BARTER_SUCCESS" },
                    { text: "B. 拒絕交換，直接回家", target: "RETURN_BUILDING" }
                ],
                onEnter: () => { state.water += 10; addInventory("純淨水 10L"); }
            },
            WATER_DELAY: {
                time: "DAY 2 - 09:30", text: "水很快分光，你只接到了 3L 水。", choices: [{ text: "返回大廈", target: "RETURN_BUILDING" }],
                onEnter: () => { state.water += 3; }
            },
            BARTER_SUCCESS: {
                time: "DAY 2 - 09:45", text: "你換到了 8 節 AA 電池與強光手電筒！防禦能力上升！", choices: [{ text: "回家防守", target: "HOME_DEFENSE" }],
                onEnter: () => { state.water -= 1; state.defense += 15; addInventory("AA電池x8"); addInventory("強光手電筒"); }
            },
            RETURN_BUILDING: {
                time: "DAY 2 - 12:00", text: "回到家中，氣溫升高，十分悶熱。", choices: [{ text: "等待下午", target: "HOME_DEFENSE" }]
            },
            
            HOME_DEFENSE: {
                time: "DAY 2 - 16:00",
                text: () => `門外傳來急促敲門聲！自稱『社區志願者』要求登記糧水，透過貓眼你發現對方沒有識別背心，口袋裡鼓囊囊的似乎藏有工具或武器！\n\n面對第一次壞人試探，你決定？`,
                choices: [
                    { text: "A. 靜默（假裝家中無人）", target: "DEFENSE_SILENT_SMS" },
                    { text: "B. 隔門罵賊（大聲威嚇叫對方滾）", target: "DEFENSE_SHOUT_FIRST" },
                    { text: "C. 大聲向鄰居呼救（隔門大喊張先生）", target: "DEFENSE_CALL_NEIGHBOR_FIRST" }
                ]
            },

            DEFENSE_SILENT_SMS: {
                time: "DAY 2 - 16:05",
                text: "門外壞人拍打了幾下門後無果，暫時走開了。你趴在門後屏住呼吸。\n\n此時，你要不要利用手機傳送 SMS 簡訊給對面鄰居張先生求助/提防？",
                choices: [
                    { text: "發送 SMS 給張先生求助（警訊發送）", target: "THIEF_NIGHT_SECOND", onSelect: () => { state.hasSentSMS = true; state.battery = Math.max(0, state.battery - 2); } },
                    { text: "不發送 SMS（保持完全靜默）", target: "THIEF_NIGHT_SECOND", onSelect: () => { state.hasSentSMS = false; } }
                ]
            },

            DEFENSE_SHOUT_FIRST: {
                time: "DAY 2 - 16:05",
                text: "你隔著鐵閘門大聲斥責！門外的人冷笑了一聲，悻悻然離去。但這暴露了你家有人且戒備心高。",
                choices: [{ text: "等待夜間到來", target: "THIEF_NIGHT_SECOND" }],
                onEnter: () => { state.hasSentSMS = false; }
            },

            DEFENSE_CALL_NEIGHBOR_FIRST: {
                time: "DAY 2 - 16:10",
                text: "你在門內大聲呼喊張先生！對面張先生立刻拿著鐵鎚開門相應，壞人見狀慌忙沿樓梯逃走！\n\n你們成功防禦並組成了 12 樓治安巡邏隊！",
                choices: [{ text: "進入第 3 天救援站", target: "RELIEF_STATION" }],
                onEnter: () => { state.defense += 25; state.morale += 20; }
            },

            THIEF_NIGHT_SECOND: {
                time: "DAY 2 - 23:30",
                text: () => {
                    let smsStatus = state.hasSentSMS ? "（提示：你之前已傳送 SMS 給張先生，他已有心理準備）" : "（提示：你從未向鄰居傳送過 SMS）";
                    let staminaStatus = `（當前個人體力：${Math.round(state.stamina)}%）`;
                    return `深夜走廊一片漆黑。隔壁傳來金屬撬鎖聲——壞人再次來訪了！而且正朝著你家門口撬鎖破門！\n\n${smsStatus}\n${staminaStatus}\n\n你決定？`;
                },
                choices: [
                    { text: "A. 大聲罵賊（獨自斥責威嚇）", target: "EVALUATE_OTHER_COMBOS" },
                    { text: "B. 靜默（繼續假裝無人死守）", target: "EVALUATE_OTHER_COMBOS" },
                    { text: "C. 大聲向鄰居呼救（大喊張先生）", target: "EVALUATE_CALL_RES" }
                ]
            },

            // 處理選項 C (向鄰居呼救) 的邏輯判定
            EVALUATE_CALL_RES: {
                time: "DAY 2 - 23:35",
                text: "你在門內奮力呼喊對面張先生！",
                choices: [],
                onEnter: () => {
                    if (state.hasSentSMS) {
                        // 有 SMS + 喊鄰居 -> 100% GOOD END
                        goToNode("REPELS_THIEF");
                    } else {
                        // 沒 SMS + 喊鄰居 -> 50% GOOD END / 50% BAD END
                        if (Math.random() < 0.5) {
                            goToNode("REPELS_THIEF");
                        } else {
                            goToNode("BAD_END_50_PERCENT");
                        }
                    }
                }
            },

            // 處理其他組合 (選 A 罵賊 或 選 B 靜默) 的體力門檻判定
            EVALUATE_OTHER_COMBOS: {
                time: "DAY 2 - 23:35",
                text: "門鎖被賊人強行撬開！衝突爆發！",
                choices: [],
                onEnter: () => {
                    if (state.stamina >= 70) {
                        // 體力 >= 70% -> 反抗成功，受傷但生存
                        goToNode("SURVIVED_WOUNDED");
                    } else {
                        // 體力 < 70% -> 體力不支，BAD END
                        goToNode("BAD_END_2");
                    }
                }
            },

            // 體力 >= 70% 獨自反抗成功
            SURVIVED_WOUNDED: {
                time: "DAY 3 - 08:00",
                text: "門鎖被撬開的瞬間，你憑藉充沛的體力（>=70%）揮舞木棍與賊人激戰！雖然手臂被割傷，但你成功將賊人打跑！\n\n你包紮了傷口，堅守到第 3 天救援站成立。",
                choices: [{ text: "前往救援站", target: "RELIEF_STATION" }],
                onEnter: () => {
                    state.stamina -= 30; // 戰鬥體力大扣
                    state.morale += 10;
                    addInventory("手臂傷口 (已包紮)");
                }
            },

            REPELS_THIEF: {
                time: "DAY 3 - 08:00", text: "張先生及時回應！你們成功嚇退了賊人，並建立 12 樓聯合巡邏隊！",
                choices: [{ text: "前往救援站", target: "RELIEF_STATION" }],
                onEnter: () => { state.defense += 20; state.morale += 20; }
            },
            RELIEF_STATION: {
                time: "DAY 3 - 10:45", text: "順利領到乾糧與 30 片淨水片！",
                choices: [{ text: "帶物資回家落袋為安", target: "HAPPY_END" }],
                onEnter: () => { state.water += 3; addInventory("淨水片x30"); }
            },

            BAD_END_2: {
                time: "DAY 2 - 23:45", isEnding: true, rank: "F", title: "【BAD END 2：體力不支被破門】",
                desc: "由於未求助鄰居且體力不足 70%，門鎖被撬開後你無力抵抗多名賊人。物資被劫掠一空，你在混亂中受傷失救……"
            },
            BAD_END_50_PERCENT: {
                time: "DAY 2 - 23:45", isEnding: true, rank: "F", title: "【BAD END：鄰居反應不及 (50%觸發)】",
                desc: "你深夜大聲呼救，但因為此前從未發過 SMS 警訊，張先生在熟睡中反應不及，等他拿著工具出來時，賊人已破開你的門鎖……"
            },
            BAD_END_EXHAUST: {
                time: "DAY 2 - 18:00", isEnding: true, rank: "F", title: "【BAD END：身體衰竭】",
                desc: "你的體力或飲用水完全耗盡。在酷熱與嚴重脫水下昏迷失救……"
            },
            HAPPY_END: {
                time: "DAY 3 - 21:40", isEnding: true, rank: "S", title: "【PERFECT END：完美生存】",
                desc: "晚上 9:40，供電與通訊全面恢復！憑藉著果斷決策與鄰里互助，你無傷順利度過了危機！"
            }
        };

        function addInventory(item) { if (!state.inventory.includes(item)) state.inventory.push(item); }

        function updateHUD() {
            document.getElementById('stat-water').innerText = state.water.toFixed(1) + " L";
            document.getElementById('stat-stamina').innerText = Math.round(state.stamina) + "%";
            document.getElementById('stat-defense').innerText = Math.round(state.defense) + "%";
            document.getElementById('stat-battery').innerText = Math.round(state.battery) + "%";
            document.getElementById('stat-morale').innerText = Math.round(state.morale) + "%";
            document.getElementById('stat-time').innerText = state.time;
            document.getElementById('time-badge').innerText = state.time;
            document.getElementById('inventory-list').innerHTML = state.inventory.map(i => `<span class="inv-tag">${i}</span>`).join('');
        }

        function goToNode(nodeKey) {
            state.currentNode = nodeKey;
            const node = nodes[nodeKey];
            state.time = node.time;

            if (node.onEnter) node.onEnter();

            let decayResult = applyTimeDecay(nodeKey);

            if (!node.isEnding && (state.water <= 0 || state.stamina <= 0)) {
                goToNode("BAD_END_EXHAUST");
                return;
            }

            updateHUD();

            document.getElementById('story-text').innerText = typeof node.text === 'function' ? node.text() : node.text;

            const decayContainer = document.getElementById('decay-container');
            if (decayResult) {
                const boxClass = decayResult.type === 'rest' ? 'rest-box' : 'decay-box';
                decayContainer.innerHTML = `<div class="${boxClass}">${decayResult.msg}</div>`;
            } else {
                decayContainer.innerHTML = '';
            }

            const eventContainer = document.getElementById('event-container');
            eventContainer.innerHTML = '';
            if (!node.isEnding && nodeKey !== 'START' && Math.random() < 0.3) {
                const ev = getRandomEvent();
                ev.effect();
                eventContainer.innerHTML = `<div class="event-box"><div class="event-title">${ev.title}</div><div class="event-desc">${ev.desc}</div></div>`;
            }

            const choicesContainer = document.getElementById('choices-container');
            choicesContainer.innerHTML = '';

            if (node.isEnding) {
                document.getElementById('modal-rank').innerText = node.rank;
                document.getElementById('modal-title').innerText = node.title;
                document.getElementById('modal-desc').innerText = node.desc;
                document.getElementById('modal-overlay').style.display = 'flex';
            } else {
                node.choices.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.innerText = c.text;
                    btn.onclick = () => {
                        if (c.onSelect) c.onSelect();
                        goToNode(c.target);
                    };
                    choicesContainer.appendChild(btn);
                });
            }
        }

        function resetToSetup() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('setup-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
